<template>
  <div class="slds-grid slds-wrap">
    <div class="slds-col slds-size_1-of-1">
      <c-text-area label="Input Text" value1={inputText1} value2={inputText2} oninput1={handleInput1} oninput2={handleInput2}></c-text-area>
      <c-toggle-buttons
        onignorewhitespaceswitch={handleIgnoreWhitespace}
        onignorecaseswitch={handleIgnoreCase}
      ></c-toggle-buttons>
      <c-summary-box summary={summary}></c-summary-box>
      <div class="slds-grid slds-wrap">
        <div class="slds-col slds-size_1-of-3">
          <c-button label="Compare" onclick={handleCompare}></c-button>
        </div>
        <div class="slds-col slds-size_1-of-3">
          <c-button label="Reset" onclick={handleReset}></c-button>
        </div>
        <div class="slds-col slds-size_1-of-3">
          <c-button label="Start New Diff" onclick={handleStartNewDiff}></c-button>
        </div>
      </div>
    </div>
  </div>
</template>
