name: 'CI: SIT & Scratch Org validation'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1-5' # Every Workday at 01:00 am

env:
  SFDX_DISABLE_DNS_CHECK: true 
  ORG_ALIAS: "MBM_SIT_CI"
  ORG_ALIAS_SCRATCH: "MBM_SCRATCH_VAL"
  SALESFORCE_CLI_VERSION: ${{ vars.SALESFORCE_CLI_VERSION }}
  TEAMS_NOTIFICATIONS_WEBHOOK: ${{ secrets.TEAMS_NOTIFICATIONS_WEBHOOK }}
  SO_OH_VALIDATION: "TRUE"
  TARGET_ORG_TYPE: "SCRATCHORGPLAIN"
  DEPLOY_OO_FOLDERS: "TRUE"
  DEPLOY_OH_FOLDERS: "TRUE"
  DEPLOY_CMP_FOLDERS: "TRUE"

jobs:
  validateAgainstSIT:
    name: SIT dry-run
    runs-on: [self-hosted, aks-gha-runners]

    steps:
      - uses: actions/checkout@v3

      - id: setup-node
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          
      # Install Salesforce CLI
      - name: 'Install Salesforce CLI'
        run: |
          sudo npm install --global @salesforce/cli@$SALESFORCE_CLI_VERSION --ignore-scripts
          sf --version

      # Make scripts executable
      - name: Make scripts executable
        run: chmod +x .deployment/scripts/*.sh && chmod +x .deployment/scripts/orchastration_mb/*.sh

      # Handle irrelevant metadata against SIT org
      - name: Handle irrelevant metadata
        run: .deployment/scripts/orchastration_mb/pre-irrelevantMetadata_SIT.sh validation
      
      # Store secret for SIT
      - name: Populate auth file with SIT_SFDX_URL secret
        run: echo ${{ secrets.SIT_SFDX_URL}} > ./SIT_SFDX_URL.txt
      
      # Authenticate to SIT
      - name: Authenticate to SIT
        run: .deployment/scripts/authenticationSFDXURL.sh $ORG_ALIAS SIT_SFDX_URL.txt SetDefault

      # Validate OneOps
      - name: Validate OneOps
        run: |
          echo "--- Validating OneOps owned components ---"
          .deployment/scripts/validateSourceFormat.sh $ORG_ALIAS NoTestRun sourcepath "core_dm common_frameworks fs_dm fs_bl fs_industryCloud/clientServices fs_clientServices fs_ivr fs_industryCloud/credit fs_credit fs_dealerMgmt fs_industryCloud/retention fs_retention fs_athlon fs_post_ui fs_post_config fs_post_access-mgmt"

      # Validate OneHouse
      - name: Validate OneHouse
        run: |
          echo "--- Validating OneHouse owned components ---"
          .deployment/scripts/validateSourceFormat.sh $ORG_ALIAS RunLocalTests sourcepath "fs_industryCloud/ohCop fs_industryCloud/ohCmp fs_ohCmp fs_ohCop"
          
  validateAgainstScratchOrg:
    name: Scratch Org dry-run
    runs-on: [self-hosted, aks-gha-runners]

    steps:
      - uses: actions/checkout@v3

      - id: setup-node
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      # Install Salesforce CLI
      - name: 'Install Salesforce CLI'
        run: |
          sudo npm install --global @salesforce/cli@$SALESFORCE_CLI_VERSION --ignore-scripts
          sf --version

      # Make scripts executable
      - name: Make scripts executable
        run: chmod +x .deployment/scripts/*.sh && chmod +x .deployment/scripts/orchastration_mb/*.sh && chmod +x .deployment/scripts/scratchOrgs/*.sh

      # Store secret for DevHub
      - name: Populate auth file with DevHub_SFDX_URL secret
        run: echo ${{ secrets.DEVHUB_SFDX_URL}} > ./DEVHUB_SFDX_URL.txt

      # Authenticate to DevHub
      - name: Authenticate to DevHub
        run: .deployment/scripts/authenticationSFDXURL.sh FS_DevHub DEVHUB_SFDX_URL.txt SetAsDefaultDEVHUB


      # Create Scratch Org
      - name: Create Scratch Org
        id: scratchOrgCreation
        run: | 
          echo "--- Starting Scratch Org creation with just managed packages installed ... ---"
          sf org create scratch --definition-file config/scratch-snapshot-plain.json --alias $ORG_ALIAS_SCRATCH --target-dev-hub FS_DevHub --duration-days 1 --wait 30 --set-default --no-track-source
          sf org list
          echo "--- Scratch Org creation completed ! ---"

      # Handle undeployable metadata against scratch orgs
      - name: Handling of undeployable metadata
        run: | 
          echo "--- Starting Scratch Org metadata prep for OmniStudio supported org ... ---"
          .deployment/scripts/orchastration_mb/pre-undeployableMetadata_scratchOrgs.sh SO_SUPPORTS_OMNI $SO_OH_VALIDATION
          echo "--- Scratch Org metadata prep completed ! ---"

      # Deploy directories to Scratch Org
      - name: Deploy directories to Scratch Org
        run: | 
          echo "--- Starting deployment of whole repository ... ---"
          .deployment/scripts/orchastration_mb/deploy-dir-structure.sh $ORG_ALIAS_SCRATCH $TARGET_ORG_TYPE $DEPLOY_OO_FOLDERS $DEPLOY_OH_FOLDERS $DEPLOY_CMP_FOLDERS
          echo "--- Scratch Org deployment completed ! ---"

      - name: Run Apex tests on Scratch Org
        continue-on-error: true
        run: .deployment/scripts/apexTestRun.sh $ORG_ALIAS_SCRATCH RunSpecifiedTests

      # Housekeeping
      - name: Delete Scratch org
        if: always() && steps.scratchOrgCreation.outcome == 'success'
        run: .deployment/scripts/scratchOrgDelete.sh $ORG_ALIAS_SCRATCH

  postToTeams:
    name: "Post outcome to Teams"    
    needs: [validateAgainstSIT, validateAgainstScratchOrg]
    if: ${{ always() }}
    runs-on: [self-hosted, aks-gha-runners]

    steps:
      - uses: actions/checkout@v3
    # Send Teams notification
      - name: Post Deployment Status to Teams
        run: |
          if [ ${{ job.status }} == 'failure' ]; then
            curl -X POST -H "Content-Type: application/json" -d '{
            "text": "Scheduled Validation: Full SIT & Scratch org dry-runs completed: VALIDATION FAILED. Job Status: ${{ job.status }}",
            "themeColor": "0ed700"
            }' $TEAMS_NOTIFICATIONS_WEBHOOK
          fi