name: 'Pull Requests: Deploy to devINT'

on:
  workflow_call:
  workflow_dispatch:

env:
  SFDX_DISABLE_DNS_CHECK: true 
  ORG_ALIAS: "MBM_devINT_CI"
  SALESFORCE_CLI_VERSION: ${{ vars.SALESFORCE_CLI_VERSION }}
  OH_DEPLOYMENT_STYLE: ${{ vars.OH_DEPLOYMENT_STYLE }}
  DEVINT_TESTRUN_ON_DEPLOYMENT: ${{ vars.DEVINT_TESTRUN_ON_DEPLOYMENT }}
  DEPLOY_DESTRUCTIVE_CHANGES: ${{ vars.DEVINT_DELTA_DEPLOY_DESTRUCTIVE_CHANGES }}
  DEPLOY_OO_FOLDERS: "TRUE"
  DEPLOY_OH_FOLDERS: "TRUE"
  DEPLOY_CMP_FOLDERS: "TRUE"

jobs:
  deploy-to-DevINT-org:
    name: Deploy to DevINT
    runs-on: [self-hosted, aks-gha-runners]
    environment: devINT
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - id: setup-node
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      # Install Salesforce CLI
      - name: 'Install Salesforce CLI'
        run: |
          sudo npm install --global @salesforce/cli@$SALESFORCE_CLI_VERSION --ignore-scripts
          sf --version
          if [ $OH_DEPLOYMENT_STYLE == 'delta' ]; then
            echo 'y' | sf plugins install sfdx-git-delta
          fi

      # Make scripts executable
      - name: Make scripts executable
        run: chmod +x .deployment/scripts/*.sh && chmod +x .deployment/scripts/orchastration_mb/*.sh

      # Store secret for devINT
      - name: Populate auth file with DEVINT_SFDX_URL secret
        run: echo ${{ secrets.DEVINT_SFDX_URL }} > ./DEVINT_SFDX_URL.txt

      # Authenticate to devINT
      - name: Authenticate to devINT
        run: .deployment/scripts/authenticationSFDXURL.sh $ORG_ALIAS DEVINT_SFDX_URL.txt SetDefault
  
      # Deploy to DevINT
      - name: Deploy to DevINT
        run: |
          if [ $OH_DEPLOYMENT_STYLE == 'delta' ]; then
            mkdir ./temp-delta-deployment
            sf sgd source delta --from "HEAD~1" --to "HEAD" --output-dir ./temp-delta-deployment --generate-delta --ignore-file .sgdeltaignore
            ls -R -l ./temp-delta-deployment
            RELEVANT_DIR_CHANGED=$(.deployment/scripts/orchastration_mb/checkChangedDirectories.sh)
            if [ $RELEVANT_DIR_CHANGED == 'TRUE' ]; then
              .deployment/scripts/deploySourceFormat.sh $ORG_ALIAS $DEVINT_TESTRUN_ON_DEPLOYMENT sourcepath ./temp-delta-deployment $DEPLOY_DESTRUCTIVE_CHANGES
            else 
              .deployment/scripts/orchastration_mb/deploy-dir-structure.sh $ORG_ALIAS $TARGET_ORG_TYPE $DEPLOY_OO_FOLDERS $DEPLOY_OH_FOLDERS $DEPLOY_CMP_FOLDERS
            fi
          else
            .deployment/scripts/orchastration_mb/deploy-dir-structure.sh $ORG_ALIAS $TARGET_ORG_TYPE $DEPLOY_OO_FOLDERS $DEPLOY_OH_FOLDERS $DEPLOY_CMP_FOLDERS
          fi 
          .deployment/scripts/deploySourceFormat.sh $ORG_ALIAS $DEVINT_TESTRUN_ON_DEPLOYMENT sourcepath fs_post_org-dependent/SIT