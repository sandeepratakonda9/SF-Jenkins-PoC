# .github/workflows/datadog-report.yml
name: "Datadog DORA Reporting"

on:
  workflow_call:
    inputs:
      deployment_status:
        required: true
        type: string
      environment:
        required: true
        type: string

jobs:
  report-to-datadog:
    name: "Report DORA Metrics and Incident"
    runs-on: [self-hosted, aks-gha-runners]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect team and service
        run: bash .deployment/scripts/detect_team.sh

      - name: Load team and service
        run: |
          source .deployment/scripts/notify_team.env
          echo "Team: $TEAM"
          echo "Service: $SERVICE_NAME"

      - name: Send DORA metrics to Datadog
        run: |
          GIT_SHA="${{ github.sha }}"
          REPO_URL="https://git.i.mercedes-benz.com/mbfs-OneOps/T1224-OneOPS"
          ENVIRONMENT="${{ inputs.environment }}"
          VERSION="$GIT_SHA"
          STATUS="${{ inputs.deployment_status }}"

          FINISHED_AT=$(date +%s)
          STARTED_AT=$((FINISHED_AT - 60))
          source .deployment/scripts/notify_team.env

          echo "Sending DORA metric: $STATUS"

          curl -X POST "https://api.datadoghq.eu/api/v2/dora/deployment" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${{ secrets.DATADOG_API_KEY }}" \
            -d "{
              \"data\": {
                \"type\": \"dora_deployment\",
                \"attributes\": {
                  \"started_at\": $STARTED_AT,
                  \"finished_at\": $FINISHED_AT,
                  \"env\": \"$ENVIRONMENT\",
                  \"status\": \"$STATUS\",
                  \"team\": \"$TEAM\",
                  \"git\": {
                    \"commit_sha\": \"$GIT_SHA\",
                    \"repository_url\": \"$REPO_URL\"
                  },
                  \"service\": \"$SERVICE_NAME\",
                  \"version\": \"$VERSION\"
                }
              }
            }"

      # Download deploy.log if failure
      - name: Download deployment log
        if: ${{ inputs.deployment_status == 'failure' }}
        uses: actions/download-artifact@v3
        with:
          name: deploy-log
          path: ./

      # Create Datadog Incident only if deployment failed
      - name: Declare Datadog Incident (with Dynamic Log Snippet & GitHub Link)
        env:
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DD_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
        run: |
          # Load environment variables from team config
          source .deployment/scripts/notify_team.env

          ENVIRONMENT="${{ inputs.environment }}"
          SEVERITY="SEV-2"

          # 🧩 Validate key variables to avoid empty fields
          if [[ -z "$SERVICE_NAME" ]]; then
            echo "[ERROR] SERVICE_NAME is missing. Please define it in workflow inputs or environment."
            exit 1
          fi

          if [[ -z "$ENVIRONMENT" ]]; then
            echo "[ERROR] ENVIRONMENT is missing. Please provide it as a workflow input."
            exit 1
          fi

          if [[ -z "$TEAM" ]]; then
            echo "[ERROR] TEAM is missing. Please check .deployment/scripts/notify_team.env."
            exit 1
          fi

          # 🧠 Get commit message (PR title or last commit)
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" && -n "${GITHUB_EVENT_PATH:-}" ]]; then
            COMMIT_MSG=$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH" | sed 's/"/\\"/g')
          else
            COMMIT_MSG=$(git log -1 --pretty=%B | sed 's/"/\\"/g')
          fi

          # 🌐 Construct GitHub Actions run URL
          REPO_URL="https://git.i.mercedes-benz.com/${GITHUB_REPOSITORY}"
          RUN_ID="${GITHUB_RUN_ID}"
          RUN_URL="${REPO_URL}/actions/runs/${RUN_ID}"

          # 🧾 Sanitize log file for Datadog
          if [[ -f ./logs/deploy.log ]]; then
            CLEAN_LOG_LINES=()
            while IFS= read -r line; do
              clean_line=$(echo "$line" \
                | sed 's/\x1B\[[0-9;]*[a-zA-Z]//g' \
                | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
                | tr -s ' ' \
                | cut -c1-120
              )
              CLEAN_LOG_LINES+=("$clean_line")
            done < ./logs/deploy.log
          else
            CLEAN_LOG_LINES=("⚠️ Log file not found.")
          fi

          # 🪶 Prepare compact log snippet (max 1024 chars)
          MAX_SCOPE_LENGTH=1024
          MAX_LINES=10
          while [[ $MAX_LINES -gt 0 ]]; do
            LOG_SNIPPET=$(printf "%s\n" "${CLEAN_LOG_LINES[@]: -$MAX_LINES}")
            RAW_SCOPE=$(cat <<EOF
          🔧 Commit: $COMMIT_MSG

          📄 Log Snippet:
          $LOG_SNIPPET

          🔍 View detailed logs: $RUN_URL
          EOF
          )
                if [[ ${#RAW_SCOPE} -le $MAX_SCOPE_LENGTH ]]; then
                  break
                fi
                ((MAX_LINES--))
              done

              ESCAPED_SCOPE=$(echo "$RAW_SCOPE" | jq -Rs '.')
              FULL_LOG=$(printf "%s\n" "${CLEAN_LOG_LINES[@]: -10}")
              RAW_BODY=$(cat <<EOF
          🔧 Commit: $COMMIT_MSG

          📄 Log Snippet:
          $FULL_LOG

          🔍 View detailed logs: $RUN_URL
          EOF
          )
              ESCAPED_BODY=$(echo "$RAW_BODY" | jq -Rs '.')

              # 🧩 Escape variables for JSON
              ESCAPED_SERVICE=$(jq -Rn --arg s "$SERVICE_NAME" '$s')
              ESCAPED_TEAM=$(jq -Rn --arg t "$TEAM" '$t')
              ESCAPED_ENV=$(jq -Rn --arg e "$ENVIRONMENT" '$e')

              # 🧱 Build JSON payload for Datadog API
              INCIDENT_PAYLOAD=$(cat <<EOF
          {
            "data": {
              "type": "incidents",
              "attributes": {
                "title": "$SERVICE_NAME Deployment to $ENVIRONMENT Failed",
                "customer_impact_scope": $ESCAPED_SCOPE,
                "customer_impact_start": "$(date --iso-8601=seconds)",
                "severity": "$SEVERITY",
                "fields": {
                  "severity": {
                    "type": "dropdown",
                    "value": "$SEVERITY"
                  },
                  "services": {
                    "type": "autocomplete",
                    "value": [ $ESCAPED_SERVICE ]
                  },
                  "env": {
                    "type": "autocomplete",
                    "value": [ $ESCAPED_ENV ]
                  },
                  "team": {
                    "type": "autocomplete",
                    "value": [ $ESCAPED_TEAM ]
                  }
                },
                "body": {
                  "type": "incident_body",
                  "content": $ESCAPED_BODY
                },
                "tags": [
                  "service:$SERVICE_NAME",
                  "env:$ENVIRONMENT",
                  "team:$TEAM"
                ]
              }
            }
          }
          EOF
          )

              # 🧩 Debug logs before sending
              echo "---- [DEBUG] Datadog Payload ----"
              echo "$INCIDENT_PAYLOAD" | jq .

              # 🚀 Call Datadog API
              RESPONSE=$(curl -s -X POST "https://api.datadoghq.eu/api/v2/incidents" \
                -H "DD-API-KEY: $DD_API_KEY" \
                -H "DD-APPLICATION-KEY: $DD_APP_KEY" \
                -H "Content-Type: application/json" \
                -d "$INCIDENT_PAYLOAD")

              echo "---- [DEBUG] Datadog API Response ----"
              echo "$RESPONSE"
